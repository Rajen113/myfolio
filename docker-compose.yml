version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: myfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myfolio
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myfolio_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/myfolio?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-super-secret-random-key-myfolio-2026}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXT_PUBLIC_ROOT_DOMAIN: "${NEXT_PUBLIC_ROOT_DOMAIN:-myfolio.com}"
      MYFOLIO_ROOT_DOMAIN: "${MYFOLIO_ROOT_DOMAIN:-myfolio.com}"
      MYFOLIO_DOMAIN_TARGET: "${MYFOLIO_DOMAIN_TARGET:-cname.myfolio.com}"
      MYFOLIO_CUSTOM_DOMAIN_ENABLED: "${MYFOLIO_CUSTOM_DOMAIN_ENABLED:-true}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy Service
  proxy:
    image: nginx:alpine
    container_name: myfolio_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
