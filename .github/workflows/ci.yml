name: MyFolio CI Pipeline

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/myfolio?schema=public"
      AUTH_SECRET: "ci-secret-key-32-bytes-minimum-length-key"
      NEXT_PUBLIC_ROOT_DOMAIN: "myfolio.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Security & Integration Unit Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: "production"
