# ==============================================================================
# MyFolio Production Nginx Reverse Proxy Configuration
# Handles root domain (myfolio.com), wildcard subdomains (*.myfolio.com),
# and user custom domains.
# ==============================================================================

server {
    listen 80;
    server_name myfolio.com *.myfolio.com _;

    # Client body size limit for profile assets / uploads
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Preserving original request host headers for subdomain & custom domain routing
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check bypass
    location /api/health {
        proxy_pass http://app:3000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
